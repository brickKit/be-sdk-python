[project]
name = "besdk"
version = "0.6.0"
description = "be-sdk-python: the official Python implementation of the BrickEnterprise component protocol (be-protocol 1.0)"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.38.0",
    "asyncpg==0.31.0",
    "nats-py==2.16.0",
    "grpcio==1.76.0",
    "grpcio-status==1.76.0",
    "protobuf==6.33.6",
    "googleapis-common-protos==1.70.0",
    "opentelemetry-api==1.38.0",
    "opentelemetry-sdk==1.38.0",
    "opentelemetry-exporter-otlp-proto-http==1.38.0",
    "opentelemetry-exporter-prometheus==0.59b0",
    "prometheus-client==0.23.1",
    "PyYAML==6.0.3",
    "PyJWT[crypto]==2.13.0",
    "httpx==0.28.1",
    "yoyo-migrations==9.0.0",
    "psycopg[binary]==3.3.6",
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.2.0",
    "hypothesis==6.168.3",
    "grpcio-tools==1.76.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["besdk*", "be*"]

[tool.setuptools.package-data]
besdk = ["_protocol/*.yaml", "_protocol/VERSION", "_protocol/ddl/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "integration: needs the throwaway PostgreSQL / NATS containers of `make itest` (skipped when absent)",
]
