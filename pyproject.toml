[project]
name = "be-sdk"
version = "3.0.0a29"
description = "The official Python SDK of the component protocol (be-protocol)"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi",
    "uvicorn",
    "httptools",  # the server parses HTTP in C (named in host.HTTPServer, so a missing wheel fails at start)
    "aiohttp",  # outbound HTTP: calls, the issuer's keys, claim checks (about 40% less CPU a call than httpx)
    "grpcio",
    "grpcio-status",
    "protobuf",
    "googleapis-common-protos",
    "asyncpg",
    "nats-py",
    "pyjwt[crypto]>=2.10.1",  # 2.10.0 matched the issuer as a substring (CVE-2024-53861)
    "prometheus-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "packaging",
    "pyyaml",  # besdk.manifest: a component's tests compare component.yaml and contract/openapi.yaml with the code
    "jsonschema-rs",  # security records against be-protocol's schemas, draft 2020-12; 3-4% of opening a record (besdk.records)
    # the callee-published contracts (generated code), at exact tags
    "contract-infra-authz @ git+https://github.com/brickKit/contract-infra-authz@v3.0.0-alpha.1#subdirectory=python",
    "contract-infra-audit @ git+https://github.com/brickKit/infra-audit@contract/v3.0.0-alpha.1#subdirectory=contract/python",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "hypothesis", "httpx", "botocore"]  # httpx: the tests' client; botocore: the reference signer

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the contract packages come from their repositories at exact tags

[tool.hatch.build.targets.wheel]
packages = ["besdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs PostgreSQL, NATS and object storage (make test-integration)"]
addopts = "-m 'not integration'"
