[project]
name = "be-sdk"
version = "3.0.0a1"
description = "The official Python SDK of the component protocol (be-protocol)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "grpcio",
    "grpcio-status",
    "protobuf",
    "googleapis-common-protos",
    "asyncpg",
    "nats-py",
    "pyjwt[crypto]",
    "aioboto3",
    "prometheus-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "packaging",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["besdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs PostgreSQL, NATS and object storage (make test-integration)"]
addopts = "-m 'not integration'"
